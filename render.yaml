services:
  - type: web
    name: bloodconnect-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma migrate deploy && npx prisma generate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false # paste your Neon connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true # Render generates a random secret for you
      - key: FRONTEND_URL
        sync: false # paste your Vercel URL here after deploying the frontend
      - key: NODE_VERSION
        value: 22.22.2
